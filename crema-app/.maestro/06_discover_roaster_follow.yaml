# Journey 6 — Roaster discovery loop. Open ROASTERS, scan the list,
# tap a row to land on the roaster's storefront, then tap Follow to
# subscribe to their feed. Mirrors what a user does when they hear
# about a new micro-roaster and want to start seeing their posts.
#
# Note: if `crema` already follows the topmost roaster, the toggle
# unfollows them. Re-running the flow flips the state back. Either
# state proves the button is wired.

appId: com.crema.app
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "feed-screen"
    timeout: 30000

# 1. Discover → ROASTERS sub-tab.
- tapOn:
    id: "tab-discover"
- tapOn:
    id: "browse-tab-roasters"

# 2. Wait for the roaster list to settle on at least one row.
- extendedWaitUntil:
    visible:
      id: "roaster-row-.*"
    timeout: 15000

# 3. Tap the topmost row.
- tapOn:
    id: "roaster-row-.*"

# 4. Land on the roaster's storefront.
- extendedWaitUntil:
    visible:
      id: "roaster-screen"
    timeout: 15000

# 5. Tap Follow (or Unfollow if already following — either toggle
#    proves the button is wired).
- tapOn:
    id: "roaster-follow-btn"
