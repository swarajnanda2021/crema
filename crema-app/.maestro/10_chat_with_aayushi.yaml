# Journey 10 — DM with a friend. Open Messages, find the existing
# Aayushi thread, send a real text message.
#
# `crema` already has a thread with `aayushi` (thread_id 2). Sending
# a fresh message proves the compose + send + optimistic-bubble path
# works end-to-end.
#
# Article-share via URL paste (`https://crema.app/article/{id}`) is
# verified manually because the Android emulator's `inputText` runs
# ~10s/char with a 120s gRPC timeout — typing the 30-char URL hangs
# the gRPC call. The unfurl logic itself is covered by render-time
# unit tests in `parseArticleShareUrl`.

appId: com.crema.app
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "feed-screen"
    timeout: 30000

# 1. Messages tab.
- tapOn:
    id: "tab-messages"

# 2. Wait for the Aayushi thread row to render.
- extendedWaitUntil:
    visible:
      id: "thread-row-aayushi"
    timeout: 15000

# 3. Open the thread.
- tapOn:
    id: "thread-row-aayushi"
- extendedWaitUntil:
    visible:
      id: "chat-thread"
    timeout: 10000

# 4. Send a real text message. Body kept short ("hi") because the
#    emulator typing speed limits anything longer.
- tapOn:
    id: "thread-compose-input"
- inputText: "hi"
- hideKeyboard
- tapOn:
    id: "thread-send-btn"

# 5. Confirm the thread is still mounted after the send.
- assertVisible:
    id: "chat-thread"
