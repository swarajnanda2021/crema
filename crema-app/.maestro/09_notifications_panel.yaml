# Journey 9 — Check notifications. Tap the bell in the mobile
# header, the slide-in panel mounts. The "did anyone react to my
# post?" check every social-app user runs throughout the day.
#
# The panel is an overlay (rendered by `MobileOverlays`), not a
# Stack screen. The testID `notifications-panel` is on the
# overlay's content View — separate from the legacy
# `notifications-screen` on the standalone /notifications route.

appId: com.crema.app
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "feed-screen"
    timeout: 30000

# 1. Tap the bell — accessibilityLabel "Notifications" on the icon
#    button in MobileHeader.
- tapOn: "Notifications"

# 2. Slide panel mounts.
- extendedWaitUntil:
    visible:
      id: "notifications-panel"
    timeout: 10000
