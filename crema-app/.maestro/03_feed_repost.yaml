# Journey 3 — Repost a post worth boosting (the "I want my followers
# to see this" gesture). Opens the repost composer, types an
# optional comment, and submits.
#
# Repost is a real engagement action; the post lands in the user's
# own feed as a new post-type=repost row. The flow exercises the
# whole repost path end-to-end.

appId: com.crema.app
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "feed-screen"
    timeout: 30000

- extendedWaitUntil:
    visible:
      id: "post-card-.*"
    timeout: 15000

# 1. Tap repost on the topmost post. PostModal opens in repost mode.
- tapOn:
    id: "action-repost-.*"

# 2. Wait for the repost composer's optional-comment input.
- extendedWaitUntil:
    visible:
      id: "repost-comment-input"
    timeout: 10000

# 3. Type a brief commentary (optional, but exercises the input).
#    Kept short ("yes") — Android emulator inputText is ~10s/char
#    with a 120s gRPC timeout.
- tapOn:
    id: "repost-comment-input"
- inputText: "yes"

# 4. Submit the repost.
- hideKeyboard
- tapOn:
    id: "repost-submit"

# 5. Modal closes and we land back on the feed. The new repost row
#    will render at the top after the optimistic insert.
- extendedWaitUntil:
    visible:
      id: "feed-screen"
    timeout: 10000
