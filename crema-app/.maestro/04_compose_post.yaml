# Journey 4 — Compose a brew note. Opens the floating "Create post"
# pill, types a teaser into the composer, then dismisses without
# submitting (image picker + upload is too heavy on the emulator
# and sending real posts on every CI run pollutes the dev feed).
#
# Verifies the composer mounts, the input testID accepts text, and
# Cancel actually closes — covers the regression class where the
# Cancel button needs two taps because the keyboard ate the first
# (the well-known iOS double-tap bug the component already guards
# against).

appId: com.crema.app
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "feed-screen"
    timeout: 30000

# 1. Tap the floating "Create post" FAB on the feed.
- tapOn:
    id: "fab-compose-post"

# 2. Composer mounts.
- extendedWaitUntil:
    visible:
      id: "compose-post-modal"
    timeout: 10000

# 3. Type a brew note into the body textarea. Kept short ("brew")
#    — Android emulator inputText is ~10s/char with a 120s gRPC
#    timeout.
- tapOn:
    id: "compose-post-input"
- inputText: "brew"

# 4. Cancel. The composer's keyboard-dismiss + close path runs
#    inline (`Keyboard.dismiss(); onCancel()`), so we don't need
#    a manual hideKeyboard first.
- tapOn:
    id: "compose-post-cancel"

# 5. Composer should be gone within a beat.
- extendedWaitUntil:
    notVisible:
      id: "compose-post-modal"
    timeout: 5000

# 6. Feed visible again.
- assertVisible:
    id: "feed-screen"
